<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Todoit 서비스 안내</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px 20px;

        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        background: #fafbfc;
        color: #252b2f;
        line-height: 1.7;
      }

      .container {
        max-width: 680px;
        margin: 0 auto;

        padding: 36px;

        background: #ffffff;

        border: 1px solid #e4e8ea;
        border-radius: 20px;
      }

      .logo {
        color: #647a8a;
        font-size: 18px;
        font-weight: 700;

        margin-bottom: 12px;
      }

      h1 {
        margin: 0 0 12px;

        font-size: 30px;
        color: #252b2f;
      }

      p {
        color: #5f686e;
        margin-bottom: 32px;
      }

      /* 메뉴 버튼을 예쁘게 꾸미는 스타일 */
      .menu-link {
        display: block;
        padding: 16px 20px;
        margin-bottom: 12px;

        background: #f3f6f8;
        border-radius: 14px;

        color: #252b2f;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;

        transition: background 0.2s;
      }

      /* 마우스를 올렸을 때 살짝 진해지게 */
      .menu-link:hover {
        background: #e4e8ea;
      }

      footer {
        margin-top: 40px;
        padding-top: 20px;

        border-top: 1px solid #e4e8ea;

        font-size: 13px;
        color: #858f95;
      }
    </style>
  </head>

  <body>
    <main class="container">
      <div class="logo">Todoit</div>

      <h1>서비스 안내</h1>

      <p>Todoit 앱 서비스 이용을 위한 안내 페이지입니다.</p>

      <a href="./privacy.html" class="menu-link"> 개인정보 처리방침 </a>
      <a href="./delete-account.html" class="menu-link"> 계정 삭제 안내 </a>

      <footer>
        Todoit<br />
        문의: todoit.vaert@gmail.com
      </footer>
    </main>
  </body>
</html>
